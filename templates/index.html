<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Video Camera Manager</title>

    <link
        rel="stylesheet"
        href="/static/css/main.css?v=31">
</head>

<body>

    <div class="pageGrid">

        <header class="titlePanel">
            <h1>Video Camera Manager</h1>
        </header>

        <section class="controlPanel">

            <button class="ccButton" id="preview-start-button" type="button">
                Start Preview
            </button>

            <button class="ccButton" id="preview-stop-button" type="button">
                Stop Preview
            </button>

            <button class="ccButton" id="capture-button" type="button">
                Capture 5 Seconds
            </button>

            <button class="ccButton" id="pi-preview-start-button" type="button">
                Start Pi Display Preview
            </button>

            <button class="ccButton" id="pi-preview-stop-button" type="button">
                Stop Pi Display Preview
            </button>

            <hr>

            <button class="ccButton" id="buffer-start-button" type="button">
                Start Buffer
            </button>

            <button class="ccButton" id="buffer-stop-button" type="button">
                Stop Buffer
            </button>

            <button class="ccButton" id="buffer-capture-button" type="button">
                Trigger Capture
            </button>

            <button class="ccButton" id="buffer-status-button" type="button">
                Check Buffer
            </button>

            <button
                class="ccButton ccButtonSecondary"
                id="event-log-clear-button"
                type="button">
                Clear Event Log
            </button>

        </section>

        <main class="cameraPanel">

            <section class="cameraGrid">

                <section class="leftColumn">

                    <section class="subPanel previewPanel">
                        <h2>Preview</h2>

                        <div
                            class="previewPlaceholder"
                            id="preview-placeholder">
                            Preview stopped
                        </div>

                        <video
                            class="cameraImage cameraImageHidden"
                            id="camera-video"
                            controls
                            muted
                            playsinline>
                        </video>
                    </section>

                    <section class="subPanel eventPanel">
                        <h2>Event Log</h2>

                        <div
                            class="eventLog"
                            id="event-log">
                        </div>
                    </section>

                    <section class="subPanel bufferPanel">
                        <h2>Buffer Status</h2>

                        <pre
                            class="statusBlock"
                            id="buffer-status-value">Not checked</pre>
                    </section>

                </section>

                <section class="subPanel metricsPanel">

                    <div class="metricsToolbar">

                        <h2>Metrics</h2>

                        <span id="graph-mean-value">
                            Mean: --
                        </span>

                        <div class="graphButtonBar">

                            <button
                                class="graphButton"
                                data-window="0.0833">
                                5 MIN
                            </button>
                            
                            <button
                                class="graphButton"
                                data-window="1">
                                1 HR
                            </button>

                            <button
                                class="graphButton"
                                data-window="6">
                                6 HR
                            </button>

                            <button
                                class="graphButton"
                                data-window="12">
                                12 HR
                            </button>

                            <button
                                class="graphButton"
                                data-window="24">
                                1 D
                            </button>

                            <button
                                class="graphButton"
                                data-window="120">
                                5 D
                            </button>

                            <button
                                class="graphButton"
                                data-window="240">
                                10 D
                            </button>

                            <button
                                class="graphButton"
                                data-window="720">
                                30 D
                            </button>

                        </div>

                    </div>

                    <div class="metricGraph">
                        <div class="metricGraphTitle">
                            Brightness
                        </div>

                        <canvas
                            class="historyGraph"
                            id="brightness-graph">
                        </canvas>
                    </div>

                    <div class="metricGraph">
                        <div class="metricGraphTitle">
                            Brightness Delta
                        </div>

                        <canvas
                            class="historyGraph"
                            id="brightness-delta-graph">
                        </canvas>
                    </div>

                    <div class="metricGraph">
                        <div class="metricGraphTitle">
                            Motion
                        </div>

                        <canvas
                            class="historyGraph"
                            id="motion-graph">
                        </canvas>
                    </div>

                    <div class="metricGraph">
                        <div class="metricGraphTitle">
                            System
                        </div>

                        <canvas
                            class="historyGraph"
                            id="system-graph">
                        </canvas>
                    </div>

                </section>

            </section>

        </main>

        <section class="statusPanel">

            <span class="statusLabel">
                Status:
            </span>

            <span id="status-value">
                Ready
            </span>

            <span
                class="heartbeatText"
                id="heartbeat-value">
                | Server: --
            </span>

        </section>

    </div>

    <script type="module" src="/static/js/app.js?v=32"></script>

</body>

</html>
